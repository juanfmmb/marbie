name: $(Build.SourceBranchName)-$(Date:yyyyMMdd)-$(Rev:r)

trigger:
  - develop
  - Main

variables:
- group: secret

stages:
- stage: BuildTest
  jobs:
  - job: sca
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: pip install -r requirements.txt
    - task: Snyk.snyk-security-scan.custom-build-release-task.SnykSecurityScan@1
      displayName: 'Snyk scan for open source vulnerabilities'
      inputs:
        serviceConnectionEndpoint: Snyk 
        severityThreshold: low
        failOnIssues: false
        projectName: "MarBie"
        organization: $(snyk-org)
        failOnThreshold: low
    
  - job: test
    pool:
      vmImage: ubuntu-latest
    steps:
    - script: pip install -r requirements.txt && pytest
      env:
        API_KEY: $(api-key)
        JWT_SECRET: $(jwt-secret)
        JWT_ALGORITHM: $(jwt-algorithm)

  - job: sast
    pool:
      name: Default
    steps:
    - task: SonarSource.sonarcloud.14d9cde6-c1da-4d55-aa01-2965cd301255.SonarCloudPrepare@3
      displayName: 'Prepare analysis on SonarQube Cloud'
      inputs:
        SonarQube: Sonarcloud
        organization: 'jfrb-org'
        scannerMode: cli
        configMode: manual
        cliProjectKey: jfrb-org_marbie
        cliProjectName: marbie
    - task: SonarSource.sonarcloud.ce096e50-6155-4de8-8800-4221aaeed4a1.SonarCloudAnalyze@3
      displayName: 'Run Code Analysis'
      inputs:
        jdkversion: 'JAVA_HOME'
    - task: SonarSource.sonarcloud.38b27399-a642-40af-bb7d-9971f69712e8.SonarCloudPublish@3
      displayName: 'Publish Quality Gate Result'

  - job: build
    pool:
      name: Default
    steps:
    - script: |
        minikube image build . -t my-devops-api

  - job: deploy
    dependsOn:
    - sca
    - test
    - build
    - sast
    pool:
      name: Default
    steps:
    - script: |
        kubectl create secret generic api-key --from-literal=API_KEY="$(api-key)"
        kubectl create secret generic jwt-secret --from-literal=JWT_SECRET="$(jwt-secret)"
        kubectl create secret generic jwt-algorithm --from-literal=JWT_ALGORITHM="$(jwt-algorithm)"

        kubectl apply -f deployment.yaml